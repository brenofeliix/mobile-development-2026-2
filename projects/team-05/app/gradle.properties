# Configurações do Gradle válidas para o projeto inteiro.
# Observação: configurações feitas pela tela do Android Studio têm prioridade sobre este arquivo.
# Mais detalhes: http://www.gradle.org/docs/current/userguide/build_environment.html

# Memória máxima (2 GB) do processo do Gradle e textos em UTF-8 (acentos corretos).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Modo paralelo (montar vários módulos ao mesmo tempo). Desligado: o projeto só tem o módulo app.
# org.gradle.parallel=true
# Cache de configuração: se nenhum arquivo de build mudou, o Gradle pula a etapa de configuração (build mais rápido).
org.gradle.configuration-cache=true
# Estilo oficial de formatação do código Kotlin.
kotlin.code.style=official
